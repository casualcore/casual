worker_processes  1;
daemon off;

pid nginx-pid-file.pid;

env CASUAL_DOMAIN_HOME;
env CASUAL_HOME;

events {
   worker_connections  1000;
}

http {
   default_type  application/octet-stream;
   underscores_in_headers on;

   sendfile        on;

   client_max_body_size 500M;

   server {
      listen       8080;
      server_name  localhost;
      access_log   access.log;


      location / {
            casual_url_prefix /;
            casual_pass;
      }
   }
}
