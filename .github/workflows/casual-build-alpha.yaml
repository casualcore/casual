name: Build Casual - Alpha
on: 
  push:
    branches:
      - 'feature/**'
      - 'patch/**'
env:
  release-type: alpha

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      major-minor: ${{ steps.version.outputs.major-minor }}
      build-version: ${{ steps.version.outputs.build-version }}
      casual-version: ${{ steps.version.outputs.casual-version }}
      casual-release: ${{ steps.version.outputs.casual-release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: casualcore/casual-version@0.1
        id: version
        with:
          release-type: ${{ env.release-type }}
  
  notification-start:
    runs-on: ubuntu-latest
    needs: [calculate-version]
    steps:  
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "Starting a new build, Repo: ${{ github.repository }}, Branch: ${{ github.ref_name }}, Version: ${{ needs.calculate-version.outputs.build-version }}, URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"           
  
  build-ubi:
    runs-on: [self-hosted, builder]
    if: ${{ success() }}
    needs: [calculate-version,notification-start]
    env:
      DISTRIBUTION: 'ubi'
    steps:
      - name: check out repository casual
        uses: actions/checkout@v6
        with:
          path: 'casual'
          fetch-depth: 0

      - name: check out casual-thirdparty 
        uses: actions/checkout@v6
        with:
          repository: 'casualcore/casual-thirdparty'
          ref: 1.9
          path: 'casual-thirdparty'
 
      - name: Build
        timeout-minutes: 15
        run: |
          pwd
          ls -lrt
          find . -name "casual-middleware*.rpm" -delete
          find . -name "report.xml" -delete
          find . -name "report.tar" -delete
          docker buildx build --progress plain --output=type=local,dest=. --build-arg CASUAL_BUILD_VERSION=${{ needs.calculate-version.outputs.casual-release }} --build-arg CASUAL_VERSION=${{ needs.calculate-version.outputs.casual-version }} --build-arg CASUAL_RELEASE=${{ needs.calculate-version.outputs.casual-release }} -f ./casual/docker/build/ubi8/Dockerfile .
          tar xvf report.tar

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ success() || failure() }}    # run this step even if previous step failed
        with:
          name: Google Tests - Ubi    # Name of the check run which will be created
          path: "./middleware/**/report.xml, ./test/report.xml"       # Path to test results
          reporter: java-junit        # Format of test result
          list-tests: 'failed'

      - name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubi_rpm
          path: ./**/casual-middleware*.rpm


  notification-end:
    runs-on: ubuntu-latest
    needs: [calculate-version,build-ubi]
    if: ${{ always() }}
    steps: 
      - uses: martialonline/workflow-status@v4
        id: check
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "Build status ${{ steps.check.outputs.status }}, Repo: ${{ github.repository }}, Branch: ${{ github.ref_name }}, Version: ${{ needs.calculate-version.outputs.build-version }}, URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"           