name: Build Casual - Release
on: 
  push:
    branches:
      - 'release/*'

env:
  build_type: normal

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      major-minor: ${{ steps.version.outputs.major-minor }}
      build-version: ${{ steps.version.outputs.build-version }}
      casual-version: ${{ steps.version.outputs.casual-version }}
      casual-release: ${{ steps.version.outputs.casual-release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: casualcore/casual-version@0.1
        id: version
        with:
          release-type: ${{ env.release-type }}
  
  notification-start:
    runs-on: ubuntu-latest
    needs: [calculate-version]
    steps:  
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "Starting a new build, Repo: ${{ github.repository }}, Branch: ${{ github.ref_name }}, Version: ${{ needs.calculate-version.outputs.build_version }}, URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"           
  
  build-ubi:
    runs-on: [self-hosted, builder]
    if: ${{ success() }}
    needs: [calculate-version,notification-start]
    env:
      DISTRIBUTION: 'ubi'
    steps:
      - name: check out repository casual
        uses: actions/checkout@v6
        with:
          path: 'casual'
          fetch-depth: 0

      - name: Build
        timeout-minutes: 15
        run: |
          find . -name "casual-middleware*.rpm" -delete
          docker buildx build --progress plain --output=type=local,dest=. --build-arg CASUAL_BUILD_VERSION=${{ needs.calculate-version.outputs.casual-release }} --build-arg CASUAL_VERSION=${{ needs.calculate-version.outputs.casual-version }} --build-arg CASUAL_RELEASE=${{ needs.calculate-version.outputs.casual-release }} -f ./casual/docker/build/ubi8/Dockerfile .

      - name: Logpublisher
        if: ${{ failure() || cancelled() }}
        run: |
          ${{ github.workspace }}/casual/pipeline/script/post/logpublisher ${{ github.workspace }}/casual.log ${DISTRIBUTION}-${{ needs.calculate-version.outputs.build_version }}

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ success() || failure() }}   # run this step even if previous step failed
        with:
          name: Google Tests - Ubi # Name of the check run which will be created
          path: report.xml       # Path to test results
          reporter: java-junit        # Format of test result

      - name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubi_rpm
          path: ./**/casual-middleware*.rpm

  tag-repo:
    runs-on: ubuntu-latest
    if: ${{ success() }}
    needs: [calculate-version,build-ubi]
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ needs.calculate-version.outputs.build_version }}
          tag_prefix: ""

  publish-version:
    runs-on: [self-hosted, casual, publish]
    needs: [build-ubi,tag-repo]
    if: ${{ success() }}
    steps:
      - name: Publish ubi
        uses: actions/download-artifact@v8
        with:
          name: ubi_rpm
          path: /var/www/release/
      - name: Move rpm to right location
        run: |
          mv /var/www/release/casual/results/*.rpm /var/www/release/
          rm -rf /var/www/release/casual

  build-casual-image:
    runs-on: [self-hosted, builder]
    needs: [calculate-version,build-ubi,publish-version]
    if: ${{ success() }}
    steps:
      - name: check out repository casual
        uses: actions/checkout@v6
        with:
          path: 'casual'
          fetch-depth: 0
      - name: Download ubi
        uses: actions/download-artifact@v8
        with:
          name: ubi_rpm
          path: ${{ github.workspace }}/casual/pipeline/script/image-build/
      - name: set rpmfile name
        id: rpmfile
        run: echo "value=$( ls -1t ${{ github.workspace }}/casual/pipeline/script/image-build/casual | head -1 )" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: CASUAL_RPM=casual/${{steps.rpmfile.outputs.value}}
          context: ${{ github.workspace }}/casual/pipeline/script/image-build/
          tags: casual/middleware:${{ needs.calculate-version.outputs.build_version }}

  notification-end:
    runs-on: ubuntu-latest
    needs: [calculate-version,build-ubi,tag-repo,publish-version,build-casual-image]
    if: ${{ always() }}
    steps: 
      - uses: martialonline/workflow-status@v4
        id: check
      - name: Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: "Build status ${{ steps.check.outputs.status }}, Repo: ${{ github.repository }}, Branch: ${{ github.ref_name }}, Version: ${{ needs.calculate-version.outputs.build_version }}, URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"           
